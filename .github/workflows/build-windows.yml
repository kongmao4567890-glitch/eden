name: Build (Windows)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Install glslangValidator
        run: |
          $url = "https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-windows-x64-Release.zip"
          Invoke-WebRequest -Uri $url -OutFile glslang.zip
          Expand-Archive -Path glslang.zip -DestinationPath C:\glslang -Force
          $glslangBin = Get-ChildItem -Path C:\glslang -Recurse -Filter "glslangValidator.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          echo "Found glslangValidator at: $glslangBin"
          echo "$glslangBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtmultimedia'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_QT=ON `
            -DYUZU_USE_BUNDLED_QT=OFF `
            -DYUZU_USE_BUNDLED_FFMPEG=ON `
            -DYUZU_USE_BUNDLED_SDL3=ON `
            -DYUZU_USE_BUNDLED_SIRIT=ON `
            -DYUZU_USE_BUNDLED_OPENSSL=ON `
            -DYUZU_TESTS=OFF `
            -DENABLE_WEB_SERVICE=OFF `
            -DENABLE_UPDATE_CHECKER=OFF `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path build\bin\eden.exe -Destination artifact\ -ErrorAction SilentlyContinue
          # Copy all DLLs from build/bin (FFmpeg, SDL3, etc.)
          Get-ChildItem -Path build\bin\*.dll | Copy-Item -Destination artifact\ -ErrorAction SilentlyContinue
          # Run windeployqt to collect all Qt6 runtime DLLs and platform plugins
          windeployqt.exe --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw --no-quick-import `
            artifact\eden.exe
          # Copy MSVC runtime DLLs (x64 only)
          $redistPath = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "vcruntime140.dll" | Where-Object { $_.DirectoryName -like "*x64*" } | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($redistPath) {
            Copy-Item -Path "$redistPath\*.dll" -Destination artifact\ -ErrorAction SilentlyContinue
            Write-Host "Copied MSVC runtime DLLs from $redistPath"
          }
          # Copy FFmpeg DLLs if they exist in build subdirs
          Get-ChildItem -Path build -Recurse -Filter "avcodec*.dll" | Select-Object -First 1 -ExpandProperty DirectoryName | ForEach-Object {
            Get-ChildItem -Path "$_\*.dll" | Copy-Item -Destination artifact\ -ErrorAction SilentlyContinue
            Write-Host "Copied FFmpeg DLLs from $_"
          }
          # List all files in artifact for verification
          Write-Host "=== Artifact contents ==="
          Get-ChildItem -Path artifact\ -Recurse | Select-Object FullName, Length
          Copy-Item -Path dist\qt_themes -Destination artifact\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path dist\languages -Destination artifact\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path dist\compatibility_list -Destination artifact\ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path artifact\* -DestinationPath eden-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: eden-windows-x64
          path: eden-windows-x64.zip
          retention-days: 30
