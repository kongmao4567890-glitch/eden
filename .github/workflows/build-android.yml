name: Build (Android)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/cpm
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Build Default APK (arm64-v8a)
        working-directory: src/android
        run: ./gradlew :app:assembleDefaultRelease --no-daemon -Pandroid.native.buildOutput=verbose

      - name: Sign APK
        run: |
          cd src/android
          APK_DIR="app/build/outputs/apk/default/release"
          if [ -f "$APK_DIR/app-default-release-unsigned.apk" ]; then
            BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | tail -1)
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
              --ks app/debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "$APK_DIR/eden-android-arm64.apk" \
              "$APK_DIR/app-default-release-unsigned.apk"
            echo "APK signed successfully"
          elif [ -f "$APK_DIR/app-default-release.apk" ]; then
            cp "$APK_DIR/app-default-release.apk" "$APK_DIR/eden-android-arm64.apk"
            echo "APK already signed"
          else
            echo "No APK found! Searching..."
            find app/build/outputs -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-arm64
          path: src/android/app/build/outputs/apk/default/release/eden-android-arm64.apk
          retention-days: 30
