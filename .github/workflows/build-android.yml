name: Build (Android)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools nasm

      - name: Setup Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Build Mainline APK (arm64-v8a)
        working-directory: src/android
        run: ./gradlew :app:assembleMainlineRelease --no-daemon -Pandroid.native.buildOutput=verbose

      - name: Sign APK
        run: |
          cd src/android
          echo "Searching for APK files..."
          find app/build/outputs -name "*.apk" 2>/dev/null
          APK=$(find app/build/outputs -name "*-release*.apk" -o -name "*-unsigned*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          APK_DIR=$(dirname "$APK")
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks app/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$APK_DIR/eden-android-arm64.apk" \
            "$APK"
          echo "APK signed successfully: $APK_DIR/eden-android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-arm64
          path: src/android/app/build/outputs/apk/**/eden-android-arm64.apk
          retention-days: 30
