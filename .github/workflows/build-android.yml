name: Build (Android)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools nasm

      - name: Setup Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build OpenSSL for Android ARM64
        run: |
          NDK=$ANDROID_HOME/ndk/28.2.13676358
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=24
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC=$TOOLCHAIN/bin/aarch64-linux-android$API-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android$API-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$TOOLCHAIN/bin/llvm-as
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          git clone --depth 1 --branch openssl-3.4.1 https://github.com/openssl/openssl.git /tmp/openssl
          cd /tmp/openssl
          ./Configure android-arm64 no-shared no-tests \
            -D__ANDROID_API__=$API \
            --prefix=/tmp/openssl-install
          make -j$(nproc)
          make install_sw

      - name: Patch build.gradle.kts to use local OpenSSL
        run: |
          cd src/android
          sed -i 's/"-DYUZU_USE_BUNDLED_FFMPEG=ON"/"-DYUZU_USE_BUNDLED_FFMPEG=ON",\n                                        "-DYUZU_USE_BUNDLED_OPENSSL=OFF",\n                                        "-DOPENSSL_ROOT_DIR=\/tmp\/openssl-install",\n                                        "-DOPENSSL_USE_STATIC_LIBS=ON"/' app/build.gradle.kts
          echo "=== Patched build.gradle.kts ==="
          grep -A2 "OPENSSL" app/build.gradle.kts || echo "Patch not found!"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Build Default APK
        working-directory: src/android
        run: ./gradlew :app:assembleDefaultRelease --no-daemon -Pandroid.native.buildOutput=verbose || ./gradlew :app:assembleRelease --no-daemon -Pandroid.native.buildOutput=verbose

      - name: Sign APK
        run: |
          cd src/android
          echo "Searching for APK files..."
          find app/build/outputs -name "*.apk" 2>/dev/null
          APK=$(find app/build/outputs -name "*-release*.apk" -o -name "*-unsigned*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          APK_DIR=$(dirname "$APK")
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks app/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$APK_DIR/eden-android-arm64.apk" \
            "$APK"
          echo "APK signed successfully: $APK_DIR/eden-android-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-arm64
          path: src/android/app/build/outputs/apk/**/eden-android-arm64.apk
          retention-days: 30
