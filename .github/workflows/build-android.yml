name: Build (Android)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            ndk;28.2.13676358
            cmake;3.31.6

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/cpm
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Build Default APK (arm64-v8a)
        working-directory: src/android
        run: ./gradlew assembleDefaultRelease --no-daemon -Pandroid.native.buildOutput=verbose

      - name: Sign APK
        run: |
          cd src/android
          if [ -f app/build/outputs/apk/default/release/app-default-release-unsigned.apk ]; then
            # Use debug keystore for signing if no release keystore is available
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner sign \
              --ks app/debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out app/build/outputs/apk/default/release/eden-android-arm64.apk \
              app/build/outputs/apk/default/release/app-default-release-unsigned.apk
            echo "APK signed successfully"
          elif [ -f app/build/outputs/apk/default/release/app-default-release.apk ]; then
            cp app/build/outputs/apk/default/release/app-default-release.apk app/build/outputs/apk/default/release/eden-android-arm64.apk
            echo "APK already signed"
          else
            echo "No APK found!"
            find app/build/outputs -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-arm64
          path: src/android/app/build/outputs/apk/default/release/eden-android-arm64.apk
          retention-days: 30
